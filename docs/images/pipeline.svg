<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1400 500" role="img" aria-labelledby="the-request-pipeline-title"><title id="the-request-pipeline-title">The request pipeline</title><desc>A request sent with mediator.send passes through MutexBehavior, then AuditBehavior, then LoggingBehavior, reaches its one handler, and the result travels back out through LoggingBehavior, AuditBehavior and MutexBehavior to the caller.</desc><style>.dg{--dg-surface:#f3ece2;--dg-alt:#fcf8f3;--dg-text:#2a1f19;--dg-muted:#69584b;--dg-line:#e0d3c2;--dg-accent:#b5502b;--dg-on-accent:#fff8f2;--dg-ring1:#f6ebe3;--dg-ring2:#f1dfd5;--dg-ring3:#ebd0c3;--dg-sans:"Avenir Next",Avenir,system-ui,-apple-system,"Segoe UI",sans-serif;--dg-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}@media (prefers-color-scheme:dark){.dg{--dg-surface:#1e1814;--dg-alt:#2a221d;--dg-text:#f2e8dc;--dg-muted:#bba996;--dg-line:#40352c;--dg-accent:#e3895f;--dg-on-accent:#24140b;--dg-ring1:#392a22;--dg-ring2:#463226;--dg-ring3:#563b2d;}}
.dg text{font-family:var(--dg-sans);fill:var(--dg-text);}
.dg .bg{fill:var(--dg-surface);}
.dg .ring1{fill:var(--dg-ring1);stroke:var(--dg-line);stroke-width:2;}
.dg .ring2{fill:var(--dg-ring2);stroke:var(--dg-line);stroke-width:2;}
.dg .ring3{fill:var(--dg-ring3);stroke:var(--dg-line);stroke-width:2;}
.dg .box{fill:var(--dg-alt);stroke:var(--dg-line);stroke-width:2;}
.dg .hot{fill:var(--dg-accent);}
.dg .arrow{fill:none;stroke:var(--dg-text);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.dg .dash{fill:none;stroke:var(--dg-muted);stroke-width:2;stroke-linecap:round;stroke-dasharray:2 8;}
.dg .dot{fill:var(--dg-alt);stroke:var(--dg-accent);stroke-width:2.5;}
.dg .title{font-size:20px;font-weight:600;letter-spacing:-0.01em;}
.dg .name{font-size:18px;font-weight:600;}
.dg .small{font-size:14.5px;fill:var(--dg-muted);}
.dg .num{font-size:14px;font-weight:600;text-anchor:middle;}
.dg .mono{font-family:var(--dg-mono);font-size:14px;}
.dg .on-hot{fill:var(--dg-on-accent);}
.dg .mid{text-anchor:middle;}
.dg .end{text-anchor:end;}
</style><rect class="bg" width="1400" height="500" rx="30"/><rect class="ring1" x="235" y="60" width="930" height="400" rx="30"/><text class="title" x="265" y="99">MutexBehavior</text><text class="small end" x="1135" y="99">outermost: first in, last out</text><rect class="ring2" x="350" y="125" width="700" height="300" rx="24"/><text class="title" x="378" y="163">AuditBehavior</text><rect class="ring3" x="465" y="190" width="470" height="200" rx="18"/><text class="title" x="491" y="226">LoggingBehavior</text><rect class="hot" x="580" y="250" width="240" height="100" rx="14"/><text class="title mid on-hot" x="700" y="296">Handler</text><text class="mid on-hot" x="700" y="321" style="font-size:14.5px">does the work, once</text><rect class="box" x="20" y="240" width="170" height="120" rx="18"/><text class="name mid" x="105" y="281">Your code</text><text class="mono mid" x="105" y="308">mediator.send(</text><text class="mono mid" x="105" y="327">request, ctx)</text><rect class="box" x="1210" y="240" width="170" height="120" rx="18"/><text class="name mid" x="1295" y="281">Back to you</text><text class="small mid" x="1295" y="308">the result,</text><text class="small mid" x="1295" y="327">or the error</text><path class="arrow" d="M196 300 H572"/><path class="arrow" d="M561 292 L574 300 L561 308"/><path class="arrow" d="M826 300 H1202"/><path class="arrow" d="M1191 292 L1204 300 L1191 308"/><circle class="dot" cx="235" cy="300" r="13"/><text class="num" x="235" y="305">1</text><circle class="dot" cx="350" cy="300" r="13"/><text class="num" x="350" y="305">2</text><circle class="dot" cx="465" cy="300" r="13"/><text class="num" x="465" y="305">3</text><circle class="dot" cx="935" cy="300" r="13"/><text class="num" x="935" y="305">4</text><circle class="dot" cx="1050" cy="300" r="13"/><text class="num" x="1050" y="305">5</text><circle class="dot" cx="1165" cy="300" r="13"/><text class="num" x="1165" y="305">6</text><text class="small mid" x="292" y="338">take the</text><text class="small mid" x="292" y="357">lock</text><text class="small mid" x="407" y="338">start the</text><text class="small mid" x="407" y="357">clock</text><text class="small mid" x="522" y="338">start the</text><text class="small mid" x="522" y="357">clock</text><text class="small mid" x="878" y="338">log one</text><text class="small mid" x="878" y="357">line</text><text class="small mid" x="993" y="338">write the</text><text class="small mid" x="993" y="357">audit row</text><text class="small mid" x="1108" y="338">release</text><text class="small mid" x="1108" y="357">the lock</text></svg>

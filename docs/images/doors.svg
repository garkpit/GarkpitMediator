<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1400 520" role="img" aria-labelledby="three-doors-one-pipeline-title"><title id="three-doors-one-pipeline-title">Three doors, one pipeline</title><desc>Web pages, a chat assistant and outside agents over MCP each call mediator.send. Every request passes through one pipeline (lock, audit, log, your own rules) to its one handler. A tool catalogue with one entry per Command and Query is what the chat assistant and MCP offer as tools.</desc><style>.dg{--dg-surface:#f3ece2;--dg-alt:#fcf8f3;--dg-text:#2a1f19;--dg-muted:#69584b;--dg-line:#e0d3c2;--dg-accent:#b5502b;--dg-on-accent:#fff8f2;--dg-ring1:#f6ebe3;--dg-ring2:#f1dfd5;--dg-ring3:#ebd0c3;--dg-sans:"Avenir Next",Avenir,system-ui,-apple-system,"Segoe UI",sans-serif;--dg-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}@media (prefers-color-scheme:dark){.dg{--dg-surface:#1e1814;--dg-alt:#2a221d;--dg-text:#f2e8dc;--dg-muted:#bba996;--dg-line:#40352c;--dg-accent:#e3895f;--dg-on-accent:#24140b;--dg-ring1:#392a22;--dg-ring2:#463226;--dg-ring3:#563b2d;}}
.dg text{font-family:var(--dg-sans);fill:var(--dg-text);}
.dg .bg{fill:var(--dg-surface);}
.dg .ring1{fill:var(--dg-ring1);stroke:var(--dg-line);stroke-width:2;}
.dg .ring2{fill:var(--dg-ring2);stroke:var(--dg-line);stroke-width:2;}
.dg .ring3{fill:var(--dg-ring3);stroke:var(--dg-line);stroke-width:2;}
.dg .box{fill:var(--dg-alt);stroke:var(--dg-line);stroke-width:2;}
.dg .hot{fill:var(--dg-accent);}
.dg .arrow{fill:none;stroke:var(--dg-text);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.dg .dash{fill:none;stroke:var(--dg-muted);stroke-width:2;stroke-linecap:round;stroke-dasharray:2 8;}
.dg .dot{fill:var(--dg-alt);stroke:var(--dg-accent);stroke-width:2.5;}
.dg .title{font-size:20px;font-weight:600;letter-spacing:-0.01em;}
.dg .name{font-size:18px;font-weight:600;}
.dg .small{font-size:14.5px;fill:var(--dg-muted);}
.dg .num{font-size:14px;font-weight:600;text-anchor:middle;}
.dg .mono{font-family:var(--dg-mono);font-size:14px;}
.dg .on-hot{fill:var(--dg-on-accent);}
.dg .mid{text-anchor:middle;}
.dg .end{text-anchor:end;}
</style><rect class="bg" width="1400" height="520" rx="30"/><rect class="box" x="60" y="30" width="280" height="110" rx="18"/><text class="name" x="86" y="70">Web pages</text><text class="small" x="86" y="96">a person presses a button</text><rect class="box" x="60" y="175" width="280" height="110" rx="18"/><text class="name" x="86" y="215">Chat assistant</text><text class="small" x="86" y="241">reads run at once; changes</text><text class="small" x="86" y="260">wait for a person to confirm</text><rect class="box" x="60" y="320" width="280" height="110" rx="18"/><text class="name" x="86" y="360">MCP</text><text class="small" x="86" y="386">outside agents: Claude, Codex,</text><text class="small" x="86" y="405">or one you wrote</text><path class="arrow" d="M346 85 C 390 85, 372 222, 405 229"/><path class="arrow" d="M346 230 H405"/><path class="arrow" d="M396 222 L409 230 L396 238"/><path class="arrow" d="M346 375 C 390 375, 372 238, 405 231"/><rect class="hot" x="415" y="195" width="290" height="70" rx="35"/><text class="mono mid on-hot" x="560" y="235" style="font-size:15px;font-weight:600">mediator.send(request, ctx)</text><path class="arrow" d="M711 230 H765"/><path class="arrow" d="M756 222 L769 230 L756 238"/><rect class="ring2" x="775" y="80" width="230" height="300" rx="24"/><text class="title mid" x="890" y="121">One pipeline</text><rect class="box" x="795" y="145" width="190" height="40" rx="20"/><text class="mid" x="890" y="171" style="font-size:15.5px">lock</text><rect class="box" x="795" y="197" width="190" height="40" rx="20"/><text class="mid" x="890" y="223" style="font-size:15.5px">audit</text><rect class="box" x="795" y="249" width="190" height="40" rx="20"/><text class="mid" x="890" y="275" style="font-size:15.5px">log</text><rect class="box" x="795" y="301" width="190" height="40" rx="20"/><text class="mid" x="890" y="327" style="font-size:15.5px">your own rules</text><path class="arrow" d="M1011 230 H1071"/><path class="arrow" d="M1062 222 L1075 230 L1062 238"/><rect class="box" x="1081" y="50" width="299" height="360" rx="24"/><text class="title mid" x="1230" y="91">One handler each</text><rect class="ring1" x="1099" y="112" width="263" height="50" rx="12"/><text class="mono" x="1115" y="143" style="font-size:15px">CreateNote</text><text class="small end" x="1346" y="143">command</text><rect class="ring1" x="1099" y="172" width="263" height="50" rx="12"/><text class="mono" x="1115" y="203" style="font-size:15px">RenameNote</text><text class="small end" x="1346" y="203">command</text><rect class="ring1" x="1099" y="232" width="263" height="50" rx="12"/><text class="mono" x="1115" y="263" style="font-size:15px">GetNote</text><text class="small end" x="1346" y="263">query</text><rect class="ring1" x="1099" y="292" width="263" height="50" rx="12"/><text class="mono" x="1115" y="323" style="font-size:15px">ListNotes</text><text class="small end" x="1346" y="323">query</text><text class="small mid" x="1230" y="381">and every feature you add</text><path class="dash" d="M1230 410 V452 Q1230 468 1214 468 H946"/><rect class="box" x="520" y="440" width="420" height="56" rx="28" style="stroke-dasharray:2 8;stroke-linecap:round"/><text class="mid" x="730" y="473" style="font-size:15.5px">Tool catalogue: one entry per Command and Query</text><path class="dash" d="M514 468 H46 Q30 468 30 452 V246 Q30 230 46 230 H56"/><path class="dash" d="M30 375 H56"/></svg>
